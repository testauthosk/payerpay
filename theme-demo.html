<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PayerPay — theme transition demo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:248 250 249; --surf:255 255 255; --ink:11 15 20; --t2:90 105 120; --line:225 230 228;
  --mint:18 185 129; --mint-deep:13 148 105; --mint-tint:222 247 238;
}
html.dark{
  --bg:11 15 20; --surf:24 32 42; --ink:233 246 239; --t2:150 165 175; --line:38 50 62;
  --mint:51 230 160; --mint-deep:51 230 160; --mint-tint:18 40 32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:rgb(var(--bg));color:rgb(var(--ink));min-height:100dvh;transition:background-color .55s ease,color .55s ease}
/* smooth theme cross-fade so the swap is never a hard snap */
.card,.sub,h1,.pill,.hint,.brand b,.card .lab,.card .big,.tbtn{transition:background-color .55s ease,color .55s ease,border-color .55s ease}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 26px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
.brand .hex{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(80% 80% at 70% 25%,rgba(51,230,160,.4),transparent 50%),linear-gradient(150deg,#16271E,#0A120E);color:#33E6A0;font-weight:800}
.brand b{color:rgb(var(--mint-deep))}
.tbtn{width:46px;height:46px;border-radius:14px;border:1px solid rgb(var(--line));background:rgb(var(--surf));color:rgb(var(--ink));display:grid;place-items:center;cursor:pointer;font-size:20px;transition:border-color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.tbtn:hover{border-color:rgb(var(--mint))}
.tbtn .ph{transition:transform .4s cubic-bezier(.34,1.3,.5,1)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.sub{color:rgb(var(--t2));font-size:14.5px;line-height:1.6;max-width:48ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.card{background:rgb(var(--surf));border:1px solid rgb(var(--line));border-radius:18px;padding:20px}
.card .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgb(var(--t2));font-weight:700}
.card .big{font-size:26px;font-weight:800;margin-top:6px}
.card .big.mint{color:rgb(var(--mint-deep))}
.pill{display:inline-block;margin-top:30px;font-size:13px;font-weight:700;color:rgb(var(--mint-deep));background:rgb(var(--mint-tint));border:1px solid rgb(var(--mint) / .3);border-radius:999px;padding:7px 16px}
.hint{margin-top:26px;font-size:12.5px;color:rgb(var(--t2))}

/* ===== sliding wordmark overlay ===== */
.tt-word{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;visibility:hidden}
.tt-word.on{visibility:visible}
.tt-word .w{font-weight:800;letter-spacing:-.02em;white-space:nowrap;will-change:transform,opacity;font-size:clamp(54px,15vw,150px);transform:translateX(var(--from,-130%)) scale(1);opacity:0}
.tt-word.slide .w{transition:transform .42s cubic-bezier(.22,.7,.25,1),opacity .25s ease;transform:translateX(0) scale(1);opacity:1}
.tt-word.burst .w{transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .5s ease;transform:translateX(0) scale(1.16);opacity:0}

/* ===== water flood overlay (works in EVERY browser, no View Transitions needed) ===== */
/* flood animated by a plain transform TRANSITION (no @keyframes, no var() in keyframes -> safe on every iOS Safari) */
.tt-flood{position:fixed;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;z-index:55;pointer-events:none;
  background:#000;transform:scale(0);opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="48" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header>
    <div class="brand"><span class="hex">P</span><span>Payer<b>Pay</b></span></div>
    <button class="tbtn" id="tbtn" aria-label="Toggle theme"><span class="ph" id="tico">☾</span></button>
  </header>
  <h1>Theme transition</h1>
  <p class="sub">Tap the toggle (top-right). The PayerPay wordmark slides in, meets the centre, then floods the new theme outward like water. On desktop it begins on hover and commits on click.</p>
  <div class="cards">
    <div class="card"><div class="lab">Total balance</div><div class="big">$24,310.84</div></div>
    <div class="card"><div class="lab">You receive</div><div class="big mint">0.01552 BTC</div></div>
  </div>
  <span class="pill">Powered by PayerPay</span>
  <div class="hint" id="hint">Current: light</div>
</div>

<div class="tt-flood" id="ttflood"></div>
<div class="tt-word" id="ttword"><div class="w" id="ttw">Payer<b>Pay</b></div></div>

<script>
(function(){
  var html=document.documentElement, btn=document.getElementById('tbtn'), ico=document.getElementById('tico');
  var word=document.getElementById('ttword'), w=document.getElementById('ttw'), hint=document.getElementById('hint');
  // Touch-capable devices (incl. iPhone/iPad-in-desktop-mode that wrongly report hover:hover)
  // must ALWAYS take the tap path. iOS swallows the synthetic `click` after a hover-handler
  // mutates the DOM, which would leave the desktop hover/click split doing "nothing".
  var hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches;
  var canHover = matchMedia('(hover:hover)').matches && !hasTouch;
  var busy=false, armed=false;

  // on-screen debug so we are not blind on a device we cannot inspect
  function dbg(s){ try{ hint.textContent='['+s+']'; }catch(e){} }
  window.addEventListener('error', function(ev){ try{ hint.textContent='JS ERROR: '+(ev.message||(ev.error&&ev.error.message)||ev); hint.style.color='#E5533C'; }catch(e){} });

  function isDark(){return html.classList.contains('dark');}
  function setIco(){ico.textContent=isDark()?'☀':'☾';}
  function applyTheme(){html.classList.toggle('dark');setIco();hint.textContent='Current: '+(isDark()?'dark':'light');}
  // full set of CSS vars for the target theme, captured without a visible repaint
  function captureVars(toDark){
    var was=html.classList.contains('dark');
    html.classList.toggle('dark',toDark);
    var cs=getComputedStyle(html), out='';
    ['--bg','--surf','--ink','--t2','--line','--mint','--mint-deep','--mint-tint'].forEach(function(n){var v=cs.getPropertyValue(n).trim();if(v)out+=n+':'+v+';';});
    html.classList.toggle('dark',was);
    return out;
  }

  // prepare the wordmark for the *upcoming* switch (color = reverse of CURRENT theme, dir by target)
  function prep(){
    var toDark=!isDark();
    // colour: reverse of currently-active theme
    w.style.color=isDark()?'#EAF2EE':'#0B0F14';
    // direction: to dark -> from left ; to light -> from right
    word.style.setProperty('--from', toDark?'-130%':'130%');
  }
  function slideIn(fast){
    word.classList.add('on');
    word.style.setProperty('--slide', fast?'.34s':'.46s');
    // force reflow so the transition runs from the start position
    void w.offsetWidth;
    word.classList.add('slide');
  }
  function slideOut(){
    word.classList.remove('slide','burst');
    setTimeout(function(){if(!busy)word.classList.remove('on');},60);
  }
  // theme change = a CLONE of the page rendered in the NEW theme, revealed in an expanding circle
  // from centre via clip-path. The real text/numbers change colour exactly as the circle sweeps over
  // them (no per-property colour transition that snaps/steps on Safari, no solid-colour fill).
  function flood(){
    busy=true; dbg('reveal');
    var toDark=!isDark();
    var vars=captureVars(toDark);
    var box=document.createElement('div');
    box.id='ttclone'; box.setAttribute('aria-hidden','true');
    box.style.cssText='position:fixed;inset:0;z-index:54;pointer-events:none;overflow:hidden;'+vars+';background:rgb(var(--bg));-webkit-clip-path:circle(0px at 50% 50%);clip-path:circle(0px at 50% 50%)';
    var root=document.querySelector('.wrap');
    var rr=root.getBoundingClientRect();
    var clone=root.cloneNode(true);
    // overlay the clone EXACTLY on the real content (0px offset) so text never shifts at the circle edge
    clone.style.cssText=(clone.getAttribute('style')||'')+';position:absolute;left:'+rr.left+'px;top:'+rr.top+'px;width:'+rr.width+'px;height:'+rr.height+'px;margin:0;'+vars;
    box.appendChild(clone);
    document.body.appendChild(box);
    var maxd=Math.ceil(Math.sqrt((innerWidth/2)*(innerWidth/2)+(innerHeight/2)*(innerHeight/2)))+6;
    var dur=canHover?720:820;
    word.classList.remove('slide'); word.classList.add('burst');
    void box.offsetWidth;
    box.style.setProperty('transition','-webkit-clip-path '+(dur/1000)+'s cubic-bezier(.45,.02,.2,1),clip-path '+(dur/1000)+'s cubic-bezier(.45,.02,.2,1)','important');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      box.style.setProperty('-webkit-clip-path','circle('+maxd+'px at 50% 50%)','important');
      box.style.setProperty('clip-path','circle('+maxd+'px at 50% 50%)','important');
    }); });
    setTimeout(function(){
      applyTheme();                                    // real page -> new theme (instant, hidden under full-circle clone)
      if(box.parentNode)box.parentNode.removeChild(box);
      word.classList.remove('on','burst','slide');
      busy=false; armed=false; dbg('done');
    }, dur+40);
  }

  // ---- desktop: arm on hover, commit on click ----
  if(canHover){
    btn.addEventListener('mouseenter',function(){ if(busy)return; armed=true; prep(); slideIn(true); });
    btn.addEventListener('mouseleave',function(){ if(busy||!armed)return; armed=false; slideOut(); });
    btn.addEventListener('click',function(){ if(busy)return; if(!armed){prep();slideIn(true);} flood(); });
  } else {
    // ---- mobile / touch: tap slides in, then floods ----
    // Bind to touchend AND click. iOS Safari can swallow the synthetic `click` after a tap
    // (when a handler mutates the DOM), so touchend guarantees the sequence still runs on
    // every iOS version (works pre-Pointer-Events too). click stays as the mouse/keyboard
    // fallback. A short lock prevents the two from double-firing for one tap.
    var tapLock=false;
    function runTap(e){
      if(e&&e.type==='touchend'&&e.cancelable)e.preventDefault(); // suppress the ghost click
      if(busy||tapLock)return;
      dbg('tap '+(e?e.type:''));
      tapLock=true; setTimeout(function(){tapLock=false;},700);
      prep(); slideIn(false);
      setTimeout(flood, 430);  // let it reach centre first
    }
    btn.addEventListener('touchend',runTap,{passive:false});
    btn.addEventListener('click',runTap);
  }
  setIco();
})();
</script>
</body>
</html>
