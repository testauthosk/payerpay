<!doctype html><html lang="en"><head>

<title>Privacy Policy — PayerPay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--surf:#18202A;--ink:#EAF0F5;--sub:#8493A1;--mint:#12B981;--line:#243040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:28px 22px 80px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em}.logo b{color:var(--mint)}.logo .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-left:3px;vertical-align:top}
.back{color:var(--sub);font-size:14px;text-decoration:none}.back:hover{color:var(--ink)}
h1{font-size:30px;letter-spacing:-.02em;margin-bottom:8px}
.upd{color:var(--sub);font-size:13px;margin-bottom:26px}
.note{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--sub);font-size:14.5px}
.note a{color:var(--mint);text-decoration:none}
</style></head>
<body><div class="wrap">
<div class="top"><span class="logo">Payer<b>Pay</b><span class="d"></span></span><a class="back" href="./business.html">← Back</a></div>

<div class="upd">Last updated: 2026</div>
<div class="note">The full Privacy Policy will be published here shortly. For any questions, contact <a href="mailto:business@payerpay.com">business@payerpay.com</a>.</div>
</div></body></html>
